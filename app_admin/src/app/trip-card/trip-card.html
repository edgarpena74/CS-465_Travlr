<!-- Create card element -->
<div class="card">
  <!-- 
    populate card header with trip names 
  -->
  <div class="card-header">
    {{ trip.name }}
  </div>

  <!-- 
    Trip images after the trip name
    the top of the card element  
    -->
  <img src="assets/images/{{ trip.image }}" alt="trip thumbnail" class="card-img-top" />

  <div>
    <!-- Subtitle header with resort title and muted text -->
    <div></div>
    <h6 class="card-subtitle mb-2 mt-2 text-muted">
      {{ trip.resort }}
    </h6>

    <!-- Section that displays the trip length and the price per person -->
    <p class="card-subtitle mt-3 mb-3 text-muted">
      <!-- 
        This uses the Angular pipe for to display the cost
        formated as $0.00
      -->
      {{ trip.length }} only {{ trip.perPerson | currency: 'USD' : 'symbol' }} per person
      <!-- {{ trip.length }} only {{ trip.perPerson }} per person -->
    </p>

    <!-- This is used to excape the inner HTML tags -->
    <p class="card-text" [innerHTML]="trip.description"></p>
  </div>

  <!-- Edit trip button -->
  <div *ngIf="isLoggedIn()">
    <button (click)="editTrip(trip)" class="btn btn-info">Edit Trip</button>
  </div>
</div>
